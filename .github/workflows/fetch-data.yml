# Refreshes the read-only hazard feeds the mobile app consumes:
#   - bulletins/active  (JMA tropical-cyclone track — scripts/fetch_typhoon.js)
#   - forecasts/rain    (Open-Meteo 7-day rain per PH region — scripts/fetch_rain.js)
#
# Both scripts write via the Admin SDK (client rules are read-only), so the
# workflow needs a service-account key:
#   1. Firebase console → Project settings → Service accounts → Generate new private key
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_SERVICE_ACCOUNT   Value: full JSON contents
#
# Until the secret is added, these runs are skipped — seed/refresh manually via
# the Firebase console (see docs/TRACKER.md status log) or locally with
# GOOGLE_APPLICATION_CREDENTIALS set.

name: fetch-data

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (typhoon track + rain forecast)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Write service-account key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > "$RUNNER_TEMP/sa.json"

      - name: Install dependencies
        run: npm ci

      - name: Fetch typhoon (JMA)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          FIREBASE_PROJECT_ID: drrm-app
        run: node fetch_typhoon.js

      - name: Fetch rain forecast (Open-Meteo)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          FIREBASE_PROJECT_ID: drrm-app
        run: node fetch_rain.js
